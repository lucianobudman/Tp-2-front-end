<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - Apple</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="Inicio">
                <svg height="18" viewBox="0 0 17 18" width="17" xmlns="http://www.w3.org/2000/svg"><path d="m15.575 12.315c-.279.578-.602 1.13-.969 1.654-.51.728-1.042 1.455-1.85 1.47-.808.015-1.068-.48-1.993-.48s-1.215.465-1.993.48c-.808.015-1.37-.713-1.88-1.44-1.042-1.485-1.838-4.2-.765-6.045.533-.915 1.485-1.485 2.52-1.5.825-.015 1.545.555 2.055.555s1.38-.69 2.37-.585c.413.015 1.575.165 2.325 1.245-.06.045-1.38.795-1.365 2.385.015 1.905 1.665 2.535 1.68 2.55-.015.045-.255.885-.84 1.71zm-2.73-10.425c.435-.525.735-1.245.645-1.965-.63.03-1.41.42-1.86.945-.405.465-.765 1.215-.66 1.92.705.06 1.44-.375 1.875-.9Z" fill="currentColor"/></svg>
            </a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation"><span class="nav-toggle-icon"></span><span class="sr-only">Abrir menú</span></button>
            <nav class="nav-menu" id="primary-navigation" aria-label="Navegación principal">
                <a href="index.html">Inicio</a><a href="iphone.html">iPhone</a><a href="ipad.html">iPad</a><a href="catalogo.html" aria-current="page">Comprar</a><a href="soporte.html">Soporte</a>
            </nav>
            <button class="cart-button" type="button" aria-label="Abrir carrito"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 7H6.1M9.5 20a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span id="cart-count" class="cart-count">0</span></button>
        </div>
    </header>

    <main class="shop-page">
        <header class="shop-hero">
            <p>Comprar</p>
            <h1>Toda una selección para vos.</h1>
        </header>
        <section id="api-section" class="products-container">
            <div class="section-header">
                <h2>Catálogo general</h2>
                <p>Explorá todos los productos de Apple disponibles.</p>
            </div>
            <div class="catalog-filters" role="group" aria-label="Filtrar catálogo">
                <button type="button" class="catalog-filter is-active" data-category="Todos">Todos</button>
                <button type="button" class="catalog-filter" data-category="iPhone">iPhone</button>
                <button type="button" class="catalog-filter" data-category="iPad">iPad</button>
                <button type="button" class="catalog-filter" data-category="Mac">Mac</button>
                <button type="button" class="catalog-filter" data-category="Watch">Watch</button>
                <button type="button" class="catalog-filter" data-category="Vision">Vision</button>
                <button type="button" class="catalog-filter" data-category="AirPods">AirPods</button>
                <button type="button" class="catalog-filter" data-category="Home">Home</button>
                <button type="button" class="catalog-filter" data-category="Entertainment">Entertainment</button>
                <button type="button" class="catalog-filter" data-category="Accesorios">Accesorios</button>
            </div>
            <p id="api-status" class="api-status">Conectando con API REST...</p>
            <div id="product-grid" class="product-grid"><p class="loading-text">Cargando catálogo...</p></div>
        </section>
    </main>
    <footer id="soporte"><div class="footer-content"><p>Copyright © 2026 Apple Inc. Todos los derechos reservados.</p></div></footer>
    <script src="js/scripts.js"></script>
</body>
</html>
